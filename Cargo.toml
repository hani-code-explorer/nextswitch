[workspace]
resolver = "2"
members = [
    "crates/nextswitch-core",
    "crates/nextswitch-sip",
    "crates/nextswitch-media",
    "crates/nextswitch-api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
