name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/design/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/design/package.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci
        working-directory: docs/design

      - name: Build with VitePress
        run: npm run build
        working-directory: docs/design

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/design/.vitepress/dist

      - name: Upload build artifact for self-hosting
        uses: actions/upload-artifact@v4
        with:
          name: nextswitch-docs
          path: docs/design/.vitepress/dist
          retention-days: 30

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
